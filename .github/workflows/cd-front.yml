    # git action workflow name
    name: front/CD
    run-name: "CD actor : ${{github.actor}}"
    on:
      workflow_dispatch:
      push:
        branches: [ "dev/front"]
        paths:
          - 'front/**'
          - '.github/workflows/*'

    jobs:
      front:
        permissions: 
          contents: read
          
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: front
        steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-node@v4
            name: node install
            with:
              node-version: 24
          - name: install npm
            run: npm ci

          - name: npm test
            run: |
                npm test -- --watchAll=false --passWithNoTests
          - name: npm build
            env:
              CI: true
              REACT_APP_API_BASE_URL: ${{ vars.REACT_APP_API_BASE_URL }}
            run: npm run build

          
          - name: install oci-cli
            run: pip install --quiet oci-cli

          - name: configure oci cli
            run: |
              mkdir -p ~/.oci
              cat > ~/.oci/config <<EOF
              [DEFAULT]
              user=${{ secrets.OCI_USER_OCID }}
              fingerprint=${{ secrets.OCI_FINGERPRINT }}
              tenancy=${{ secrets.OCI_TENANCY_OCID }}
              region=${{ vars.OCI_REGION }}
              key_file=~/.oci/key.pem
              EOF
              echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/key.pem
              chmod 600 ~/.oci/key.pem ~/.oci/config
    
          - name: Upload to OCI Object Storage
            run: |
              BUCKET="${{ secrets.OCI_BUCKET_NAME }}"
              NAMESPACE="${{ vars.OCI_NAMESPACE }}"

              echo "1. 기존 버킷 내 객체 전체 삭제 중..."

              EXISTING_FILES=$(oci os object list \
                --namespace-name "$NAMESPACE" \
                --bucket-name "$BUCKET" \
                --all \
                --query 'data[].name' \
                --raw-output)

              echo "$EXISTING_FILES" | jq -r '.[]' | while IFS= read -r file; do
                [ -z "$file" ] && continue

                echo "삭제: $file"

                oci os object delete \
                  --namespace-name "$NAMESPACE" \
                  --bucket-name "$BUCKET" \
                  --name "$file" \
                  --force
              done

              echo "2. 새로운 빌드 파일 업로드 중..."

              find build -type f | while IFS= read -r file; do

                # build/ 이후의 경로를 Object Storage object name으로 사용
                object="${file#build/}"

                case "$file" in
                  *.html)
                    CONTENT_TYPE="text/html"
                    ;;
                  *.js)
                    CONTENT_TYPE="application/javascript"
                    ;;
                  *.css)
                    CONTENT_TYPE="text/css"
                    ;;
                  *.json)
                    CONTENT_TYPE="application/json"
                    ;;
                  *.svg)
                    CONTENT_TYPE="image/svg+xml"
                    ;;
                  *.png)
                    CONTENT_TYPE="image/png"
                    ;;
                  *.jpg|*.jpeg)
                    CONTENT_TYPE="image/jpeg"
                    ;;
                  *.gif)
                    CONTENT_TYPE="image/gif"
                    ;;
                  *.webp)
                    CONTENT_TYPE="image/webp"
                    ;;
                  *.ico)
                    CONTENT_TYPE="image/x-icon"
                    ;;
                  *.woff)
                    CONTENT_TYPE="font/woff"
                    ;;
                  *.woff2)
                    CONTENT_TYPE="font/woff2"
                    ;;
                  *)
                    CONTENT_TYPE="application/octet-stream"
                    ;;
                esac

                echo "업로드: $object"
                echo "Content-Type: $CONTENT_TYPE"

                oci os object put \
                  --namespace-name "$NAMESPACE" \
                  --bucket-name "$BUCKET" \
                  --name "$object" \
                  --file "$file" \
                  --content-type "$CONTENT_TYPE" \
                  --force

              done
                  
                      